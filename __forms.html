<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Forms</title></head>
<body>
  <!-- Contact form skeleton for Netlify Forms build-time detection -->
  <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact" />
    <input name="bot-field" />
    <input name="name" />
    <input name="email" />
    <input name="phone" />
    <textarea name="message"></textarea>
  </form>

  <!-- Service request form skeleton for Netlify Forms build-time detection -->
  <form name="service-request" method="POST" data-netlify="true" enctype="multipart/form-data" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="service-request" />
    <input name="bot-field" />
    <input name="company-name" />
    <input name="contact-person" />
    <input name="email" />
    <input name="phone" />
    <textarea name="service-address"></textarea>
    <input name="vin-serial" />
    <input name="year-built" />
    <input name="hour-meter" />
    <input name="mileage" />
    <input name="engine-type" />
    <textarea name="problem-description"></textarea>
    <input name="when-started" />
    <input name="is-operational" />
    <input name="occurrence" />
    <textarea name="recent-maintenance"></textarea>
    <input name="repaired-before" />
    <input type="file" name="image-1" />
    <input type="file" name="image-2" />
    <input type="file" name="image-3" />
    <input name="signature" />
    <input name="authorization-date" />
    <input name="authorized" />
  </form>
</body>
</html>
